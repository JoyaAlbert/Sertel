<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Configuración</title>

    <link rel="stylesheet" href="./css/iroom.css">
</head>



<body class="pagina-config">
    <button id="botonTema" class="boton-tema" type="button">Modo oscuro</button>
    <main>
        <header>
            <h1>Configuración de la habitación</h1>
        </header>
        <form id="configForm" oninput="calcularDiferencia()" onsubmit="return validarFormulario()" novalidate>
            <section>
                <h2>Datos de la habitación</h2>
                <div class="campo">
                    <label for="countryInput">País:</label>
                        <input id="countryInput" list="country" oninput="checkCountry()" required>

                        <datalist id="country">
                        <option value="España">
                        <option value="Portugal">
                        <option value="Alemania">
                        <option value="Francia">
                        <option value="Italia">
                        </datalist>

                        <output id="countryMessage"></output>
                </div>
                <div class="campo">
                    <label for="city">Ciudad:</label>
                    <input type="text" id="city">
                </div>
                <div class="campo">
                    <label for="gps">Coordenadas GPS:</label>
                    <input type="text" id="gps">
                    <button type="button" onclick="crearEnlaceMapa()">Crear enlace al mapa</button>
                    <output id="mapMessage"></output>
                </div>
                <div class="campo">
                    <label for="mapUrl">Mapa URL:</label>
                    <input type="url" id="mapUrl">
                </div>
                <div class="campo">
                    <label for="photo">Foto:</label>
                    <input type="file" id="photo">
                </div>
                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" oninput="checkPass()" required>
                    <output id="passwordMessage"></output>
                </div>
                <div class="campo">
                    <label for="currentTemperature">Temperatura actual (°C):</label>
                    <input type="number" id="currentTemperature" min="-273.15" step="any" required>
                </div>
                <button type="submit">Enviar</button>
            </section>

            <section>
                <h2>Seleccione los sensores</h2>
                <div><input type="checkbox"> Temperatura</div>
                <div><input type="checkbox"> Humedad</div>
                <div><input type="checkbox"> Nivel de sonido</div>
                <div><input type="checkbox"> Nivel de luz</div>
                <div><input type="checkbox"> Movimiento</div>

                <h2>Configure alertas</h2>
                <div class="campo">
                    <label for="maxima">Temperatura máxima:</label>
                    <input type="number" id="maxima" min="-20" max="45" step="0.1" required>
                </div>
                <div class="campo">
                    <label for="minima">Temperatura mínima:</label>
                    <input type="number" id="minima" min="-20" max="45" step="0.1" required>
                </div>
                <div class="campo">
                    <label>Diferencia:</label>
                    <output id="diferencia"></output>
                </div>
            </section>
        </form>

        <div id="modal" class="modal" hidden>
            <div class="modal-contenido" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <h2 id="modalTitle">Aviso</h2>
                <p id="modalMessage"></p>
                <button type="button" onclick="closeModal()">Cerrar</button>
            </div>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Pagina Principal</a></li>
            </ul>
        </nav>
        <footer>
            Universidad de Alcalá
        </footer>
    </main>

<script>
    function calcularDiferencia() {
        let maxima = document.getElementById("maxima");
        let minima = document.getElementById("minima");
        let diferencia = document.getElementById("diferencia");
        if (maxima.value === "" || minima.value === "") {
            diferencia.value = "";
            return;
        }
        if (!maxima.checkValidity() || !minima.checkValidity()) {
            diferencia.value = "Introduce valores válidos entre -20 °C y 45 °C";
            return;
        }
        let max = Number(maxima.value);
        let min = Number(minima.value);
        if (max < min) {
            diferencia.value ="La temperatura máxima no puede ser menor que la mínima";
            return;
        }
        diferencia.value = (max - min).toFixed(1) + " °C";
    }
</script>

<script src="datos.js"></script>
<script src="tema.js?v=2"></script>
</body>
</html>
