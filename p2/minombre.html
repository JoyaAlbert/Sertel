<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Local storage Nombre</title>
    <link rel="stylesheet" href="./css/iroom.css">
</head>
<body>
    <button id="botonTema" class="boton-tema" type="button">Modo oscuro</button>
    <form onsubmit="guardarNombre()">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">
        <input type="submit" value="Guardar">
    </form>
    <hr>
    <h2>Comprobar correo electrónico</h2>
    <label for="email">Correo:</label>
    <input type="text" id="email">
    <button type="button" onclick="validarCorreoSinRegex()">Comprobar sin regex</button>
    <button type="button" onclick="validarCorreoConRegex()">Comprobar con regex</button>
    <p id="emailMessage"></p>
    <script>
        function guardarNombre() {
            let fname = document.getElementById("nombre").value;
            localStorage.setItem("fname", fname);
        }

        document.getElementById("nombre").value = localStorage.getItem("fname") || "";
    </script>
    <script src="datos.js"></script>
    <script src="tema.js?v=2"></script>
    <div><a href="index.html">Pagina Principal</a></div>
</body>
</html>
