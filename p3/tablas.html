<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tablas</title>

    <link rel="stylesheet" href="./css/iroom.css?v=3">
</head>

<body>
    <button id="botonTema" class="boton-tema" type="button">Modo oscuro</button>
    <main>
    <table id="miTabla">
        <thead>
            <tr>
                <th>Ciudad</th>
                <th><label>Temperatura (°C) <input type="checkbox" class="dato-histograma" value="1"></label></th>
                <th><label>Humedad (%) <input type="checkbox" class="dato-histograma" value="2"></label></th>
                <th><label>Ruido <input type="checkbox" class="dato-histograma" value="3"></label></th>
                <th><label>Nivel de luz <input type="checkbox" class="dato-histograma" value="4"></label></th>
                <th>Color de iluminación</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>Alcalá de Henares</td><td>25</td><td>48</td><td>150</td><td>120</td><td>000000</td></tr>
            <tr><td>Alicante</td><td>30</td><td>69</td><td>180</td><td>211</td><td>FF0000</td></tr>
            <tr><td>Badajoz</td><td>35</td><td>30</td><td>50</td><td>150</td><td>00FF00</td></tr>
            <tr><td>Burgos</td><td>18</td><td>42</td><td>211</td><td>180</td><td>0000FF</td></tr>
            <tr><td>Córdoba</td><td>35</td><td>41</td><td>150</td><td>50</td><td>FFFFFF</td></tr>
            <tr><td>Madrid</td><td>26</td><td>40</td><td>120</td><td>200</td><td>FFFF00</td></tr>
            <tr><td>Barcelona</td><td>24</td><td>65</td><td>140</td><td>180</td><td>FF0000</td></tr>
            <tr><td>Valencia</td><td>28</td><td>60</td><td>100</td><td>210</td><td>00FF00</td></tr>
            <tr><td>Sevilla</td><td>34</td><td>35</td><td>90</td><td>240</td><td>0000FF</td></tr>
            <tr><td>Zaragoza</td><td>27</td><td>38</td><td>110</td><td>190</td><td>FFFFFF</td></tr>
        </tbody>
    </table>

    <div id="paginacion" class="paginacion-container"></div>
    <p id="mensaje-tabla"></p>

    <div id="histograma" style="display: none;">
        <h2 id="titulo-histograma"></h2>
        <div id="barras-histograma"></div>
    </div>

        <nav>
            <a href="index.html">Página principal</a>
        </nav>
    </main>






<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>
     
$(document).ready(function() {

    // CONFIGURACIÓN
    const filasPorPagina = 5;
    const totalPaginas = 4;
    const campos = ['ciudad', 'temperatura', 'humedad', 'ruido', 'luz', 'color'];

    const tabla = $('#miTabla tbody');
    const filasOriginales = tabla.find('tr').clone();
    const paginacion = $('#paginacion');

    let paginaActual = 1;


    // AÑADIR UNA FILA A LA TABLA
    function añadirFila(datos) {
        const fila = $('<tr>');

        for (let i = 0; i < campos.length; i++) {
            const celda = $('<td>');
            celda.text(datos[campos[i]]);
            fila.append(celda);
        }

        tabla.append(fila);
    }


    // DAR FORMATO A LA TABLA
    function darFormato() {
        $('#miTabla').css('border-collapse', 'collapse');

        $('#miTabla th').css({
            'background-color': '#24527a',
            'color': 'white',
            'padding': '8px'
        });

        tabla.find('td').css({
            'border': '1px solid #cccccc',
            'padding': '8px'
        });
    }


    // CARGAR PÁGINAS 1 Y 2 (DATOS LOCALES)
    function cargarPaginaLocal(pagina) {
        const inicio = (pagina - 1) * filasPorPagina;
        const fin = inicio + filasPorPagina;

        tabla.append(filasOriginales.slice(inicio, fin).clone());

        actualizarTabla();
    }


    // CARGAR PÁGINA 3 (XML CON JAVASCRIPT NATIVO)
    function cargarXML() {
        const peticion = new XMLHttpRequest();

        peticion.open('GET', 'data/pagina3.xml');

        peticion.onload = function() {
            // No mostrar la respuesta si ya estamos en otra página
            if (paginaActual !== 3) {
                return;
            }

            if (peticion.status !== 200 || !peticion.responseXML) {
                mostrarError('No se pudo cargar el XML');
                return;
            }

            const estaciones = peticion.responseXML.getElementsByTagName('estacion');

            const cuerpoTabla = document.querySelector('#miTabla tbody');

            for (let i = 0; i < estaciones.length; i++) {
                const fila = cuerpoTabla.insertRow();

                for (let j = 0; j < campos.length; j++) {
                    const dato = estaciones[i].getElementsByTagName(campos[j])[0];
                    const celda = fila.insertCell();
                    celda.textContent = dato.textContent;
                }
            }

            actualizarTabla();
        };

        peticion.onerror = function() {
            if (paginaActual === 3) {
                mostrarError('No se pudo cargar el XML');
            }
        };

        peticion.send();
    }


    // CARGAR PÁGINA 4 (JSON CON JQUERY)
    function cargarJSON() {
        $.ajax({
            url: 'data/pagina4.json',
            dataType: 'json',
            success: function(estaciones) {
                if (paginaActual !== 4) {
                    return;
                }

                for (let i = 0; i < estaciones.length; i++) {
                    añadirFila(estaciones[i]);
                }

                actualizarTabla();
            },
            error: function() {
                if (paginaActual === 4) {
                    mostrarError('No se pudo cargar el JSON');
                }
            }
        });
    }


    // ACTUALIZAR TABLA E HISTOGRAMA
    function actualizarTabla() {
        $('#mensaje-tabla').text('');
        darFormato();
        mostrarHistograma();
    }


    // MOSTRAR ERRORES
    function mostrarError(mensaje) {
        $('#mensaje-tabla').text(mensaje);
        mostrarHistograma();
    }


    // CAMBIAR DE PÁGINA
    function mostrarPagina(pagina) {
        paginaActual = pagina;

        tabla.empty();
        $('#mensaje-tabla').text('');

        $('.paginacion-btn').removeClass('active');
        const boton = $('.paginacion-btn[data-pagina="' + pagina + '"]');
        boton.addClass('active');

        // Ocultar el histograma mientras se cargan los datos
        $('#histograma').hide();

        if (pagina <= 2) {
            cargarPaginaLocal(pagina);

        } else if (pagina === 3) {
            $('#mensaje-tabla').text('Cargando...');
            cargarXML();

        } else if (pagina === 4) {
            $('#mensaje-tabla').text('Cargando...');
            cargarJSON();
        }
    }


    // MOSTRAR HISTOGRAMA
    function mostrarHistograma() {
        const seleccionado = $('.dato-histograma:checked');
        const barras = $('#barras-histograma');

        barras.empty();

        if (seleccionado.length === 0 || tabla.find('tr').length === 0) {
            $('#histograma').hide();
            return;
        }

        const columna = Number(seleccionado.val());
        const filas = tabla.find('tr');
        let maximo = 1;

        // Buscar el valor máximo para escalar las barras
        for (let i = 0; i < filas.length; i++) {
            const celdas = filas.eq(i).find('td');
            const valor = Number(celdas.eq(columna).text());
            if (valor > maximo) {
                maximo = valor;
            }
        }

        // Título del histograma
        $('#titulo-histograma').text(
            seleccionado.parent().text().trim()
        );

        // Crear una barra por cada ciudad
        for (let i = 0; i < filas.length; i++) {
            const celdas = filas.eq(i).find('td');

            const ciudad = celdas.eq(0).text();
            const valor = Number(celdas.eq(columna).text());
            const porcentaje = (valor / maximo) * 100;

            const fila = $('<div class="fila-histograma">');
            const fondo = $('<div class="fondo-histograma">');
            const barra = $('<div class="barra-histograma">');

            barra.css('width', porcentaje + '%');
            fondo.append(barra);

            const nombreCiudad = $('<span class="ciudad-histograma">');
            nombreCiudad.text(ciudad);
            const numero = $('<span>');
            numero.text(valor);

            fila.append(nombreCiudad);
            fila.append(fondo);
            fila.append(numero);
            barras.append(fila);
        }

        $('#histograma').show();
    }


    // CHECKBOXES DEL HISTOGRAMA
    $('.dato-histograma').on('change', function() {
        $('.dato-histograma').not(this).prop('checked', false);
        mostrarHistograma();
    });


    // CREAR BOTONES DE PAGINACIÓN
    for (let i = 1; i <= totalPaginas; i++) {
        const boton = $('<button>');
        boton.addClass('paginacion-btn');
        boton.attr('data-pagina', i);
        boton.text('Página ' + i);

        paginacion.append(boton);
    }


    // EVENTO DE LOS BOTONES
    $('.paginacion-btn').on('click', function() {
        const pagina = $(this).data('pagina');
        mostrarPagina(pagina);
    });


    // MOSTRAR LA PRIMERA PÁGINA AL INICIAR
    mostrarPagina(1);

});

    </script>



<script src="tema.js?v=2"></script>
</body>
